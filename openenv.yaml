name: loan-approval-env
version: "1.0"

endpoints:
  reset: "POST /reset"
  step: "POST /step"
  state: "GET /state"

state_model: "env:ApplicantState"
action_model: "env:ApplicantAction"

inference_script: "inference.py"

tasks:
  - id: easy_task
    entry_point: inference:run_easy
    grader: graders:EasyGrader

  - id: medium_task
    entry_point: inference:run_medium
    grader: graders:MediumGrader

  - id: hard_task
    entry_point: inference:run_hard
    grader: graders:HardGrader
